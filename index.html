<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka Słówek Niemiecki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
        }

        .streak-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .streak-number {
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fire {
            font-size: 36px;
            animation: flicker 0.5s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            position: relative;
            bottom: -2px;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .vocabulary-mode {
            display: grid;
            gap: 20px;
        }

        .direction-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .direction-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .direction-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .word-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #eee;
            position: relative;
        }

        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .word-card.flipped {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .word-front {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .word-card.flipped .word-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .click-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }

        .word-card.flipped .click-hint {
            color: rgba(255, 255, 255, 0.7);
        }

        .word-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #eee;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #667eea;
        }

        .word-card.flipped .word-number {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .test-mode {
            display: grid;
            gap: 20px;
        }

        .test-options {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .test-option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .test-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .test-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .test-option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .test-option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .test-question {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .test-word {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .test-progress {
            background: #eee;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .test-progress-bar {
            background: #667eea;
            height: 100%;
            transition: width 0.3s;
        }

        .test-result {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .test-result.success {
            background: #e8f5e9;
        }

        .test-result.fail {
            background: #ffebee;
        }

        .result-number {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .test-result.success .result-number {
            color: #4caf50;
        }

        .test-result.fail .result-number {
            color: #f44336;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #eee;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        .test-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .filter-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
        }

        .no-errors {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error-word-card {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .error-word {
            font-weight: bold;
            color: #f44336;
            margin-bottom: 5px;
        }

        .error-count {
            font-size: 12px;
            color: #999;
        }

        .test-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .test-input {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .test-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .test-input.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .test-input.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .feedback-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
        }

        .feedback-close {
            background: #ffebee;
            color: #f44336;
            border: 2px solid #f44336;
        }

        .feedback-close-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        .feedback-almost {
            background: #fff3e0;
            color: #f57c00;
            border: 2px solid #f57c00;
        }

        .feedback-almost-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        .feedback-correct {
            background: #e8f5e9;
            color: #4caf50;
            border: 2px solid #4caf50;
        }

        .feedback-correct-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        .correct-answer-reveal {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #f44336;
        }

        .correct-answer-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .correct-answer-text {
            font-size: 18px;
            font-weight: bold;
            color: #f44336;
        }

        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🇩🇪 Nauka Słówek Niemiecki</h1>
                <p>Trends neu - Lekcje 1.1 i 1.2</p>
            </div>
            <div class="streak-box">
                <div class="streak-number">
                    <span class="fire">🔥</span>
                    <span id="streakCount">0</span>
                </div>
                <div>Dni nauki</div>
            </div>
        </div>

        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('test')">✍️ Test</button>
                <button class="tab-btn" onclick="switchTab('errors')">⚠️ Błędy</button>
            </div>

            <!-- TAB: Test -->
            <div id="test" class="tab-content active">
                <div class="test-mode">
                    <div class="test-filters">
                        <button class="filter-option selected" onclick="setTestFilter('all')">Wszystkie</button>
                        <button class="filter-option" onclick="setTestFilter('errors')">Tylko błędy</button>
                        <button class="filter-option" onclick="setTestFilter('de-pl')">DE → PL</button>
                        <button class="filter-option" onclick="setTestFilter('pl-de')">PL → DE</button>
                    </div>

                    <div id="testContainer"></div>
                </div>
            </div>

            <!-- TAB: Errors -->
            <div id="errors" class="tab-content">
                <div>
                    <div class="stats" id="errorStats"></div>
                    <div id="errorsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            { de: 'Beantworter die Fragen', pl: 'Odpowiadaj na pytania' },
            { de: 'Lies die Texte', pl: 'Czytaj teksty' },
            { de: 'Wer', pl: 'Kto' },
            { de: 'Wo', pl: 'Gdzie' },
            { de: 'Wie', pl: 'Jak' },
            { de: 'Hilf mir', pl: 'Pomóż mi' },
            { de: 'Hallo', pl: 'Cześć' },
            { de: 'Ich bin', pl: 'Jestem' },
            { de: 'Ich wohne', pl: 'Mieszkam' },
            { de: 'Frage', pl: 'Pytanie' },
            { de: 'Antwort', pl: 'Odpowiedź' },
            { de: 'Fan', pl: 'Fan' },
            { de: 'Englisch', pl: 'Angielski' },
            { de: 'Spanien', pl: 'Hiszpania' },
            { de: 'Polen', pl: 'Polska' },
            { de: 'Portugal', pl: 'Portugalia' },
            { de: 'England', pl: 'Anglia' },
            { de: 'Italien', pl: 'Włochy' },
            { de: 'Buchstabiere', pl: 'Przeliteruj' },
            { de: 'Alphabet', pl: 'Alfabet' },
            { de: 'Name', pl: 'Imię' },
            { de: 'Guten Morgen', pl: 'Dzień dobry' },
            { de: 'Familie', pl: 'Rodzina' },
            { de: 'Freund', pl: 'Przyjaciel' },
            { de: 'Lehrer', pl: 'Nauczyciel' },
            { de: 'Schule', pl: 'Szkoła' },
            { de: 'Stadt', pl: 'Miasto' },
            { de: 'Land', pl: 'Kraj' },
            { de: 'Bruder', pl: 'Brat' },
            { de: 'Schwester', pl: 'Siostra' },
            { de: 'Mutter', pl: 'Matka' },
            { de: 'Vater', pl: 'Ojciec' },
            { de: 'Präsident', pl: 'Prezydent' },
            { de: 'Modell', pl: 'Model' },
            { de: 'Berlin', pl: 'Berlin' },
            { de: 'Dia', pl: 'Slajd' },
            { de: 'Welche Form', pl: 'Jaka forma' },
            { de: 'Sprechen', pl: 'Mówić' },
            { de: 'Hören', pl: 'Słuchać' },
            { de: 'Schreiben', pl: 'Pisać' }
        ];

        let wordErrors = {};
        let testFilter = 'all';
        let currentTestIndex = 0;
        let testAnswers = {};
        let testWords = [];
        let currentAttempt = 0;
        let isAnswered = false;

        function init() {
            loadStreak();
            loadErrors();
            renderVocabulary();
            startNewTest();
        }

        function loadStreak() {
            const streak = localStorage.getItem('streak') || 0;
            document.getElementById('streakCount').textContent = streak;
        }

        function incrementStreak() {
            let streak = parseInt(localStorage.getItem('streak') || 0);
            streak++;
            localStorage.setItem('streak', streak);
            document.getElementById('streakCount').textContent = streak;
        }

        function loadErrors() {
            const errors = localStorage.getItem('wordErrors');
            wordErrors = errors ? JSON.parse(errors) : {};
        }

        function saveErrors() {
            localStorage.setItem('wordErrors', JSON.stringify(wordErrors));
        }

        // Levenshtein distance to detect typos
        function levenshteinDistance(a, b) {
            const aLen = a.length;
            const bLen = b.length;
            const matrix = [];

            for (let i = 0; i <= bLen; i++) {
                matrix[i] = [i];
            }

            for (let j = 0; j <= aLen; j++) {
                matrix[0][j] = j;
            }

            for (let i = 1; i <= bLen; i++) {
                for (let j = 1; j <= aLen; j++) {
                    if (b[i - 1] === a[j - 1]) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }

            return matrix[bLen][aLen];
        }

        function isAlmostCorrect(answer, correct) {
            const normalized1 = answer.toLowerCase().trim();
            const normalized2 = correct.toLowerCase().trim();

            if (normalized1 === normalized2) return { type: 'correct', distance: 0 };

            const distance = levenshteinDistance(normalized1, normalized2);
            const maxLen = Math.max(normalized1.length, normalized2.length);
            
            // Jeśli różnica to 1-2 znaki na dłuższe słowo, to literówka
            if (distance <= 2 && maxLen >= 4) {
                return { type: 'almost', distance };
            } else if (distance <= 1) {
                return { type: 'almost', distance };
            }

            return { type: 'wrong', distance };
        }

        function setTestFilter(filter) {
            testFilter = filter;
            document.querySelectorAll('.filter-option').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            startNewTest();
        }

        function getTestWords() {
            if (testFilter === 'all') {
                return vocabulary.map((word, idx) => ({...word, originalIndex: idx}));
            } else if (testFilter === 'errors') {
                return vocabulary.filter((word, idx) => wordErrors[idx] > 0).map((word, idx) => ({...word, originalIndex: idx}));
            } else if (testFilter === 'de-pl') {
                return vocabulary.map((word, idx) => ({...word, originalIndex: idx, direction: 'de-pl'}));
            } else if (testFilter === 'pl-de') {
                return vocabulary.map((word, idx) => ({...word, originalIndex: idx, direction: 'pl-de'}));
            }
        }

        function startNewTest() {
            testWords = getTestWords();
            if (testWords.length === 0) {
                document.getElementById('testContainer').innerHTML = '<div class="no-errors">Brak słówek do testu</div>';
                return;
            }
            shuffleArray(testWords);
            currentTestIndex = 0;
            testAnswers = {};
            renderTestQuestion();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function renderTestQuestion() {
            if (currentTestIndex >= testWords.length) {
                showTestResult();
                return;
            }

            const container = document.getElementById('testContainer');
            const wordData = testWords[currentTestIndex];
            const isDE = testFilter === 'pl-de' ? false : true;
            const question = isDE ? wordData.de : wordData.pl;
            const correctAnswer = isDE ? wordData.pl : wordData.de;

            const progress = ((currentTestIndex + 1) / testWords.length) * 100;

            container.innerHTML = `
                <div class="test-progress">
                    <div class="test-progress-bar" style="width: ${progress}%"></div>
                </div>
                <div class="test-question">
                    <div style="font-size: 12px; color: #999; margin-bottom: 10px;">Pytanie ${currentTestIndex + 1} z ${testWords.length}</div>
                    <div class="test-word">${question}</div>
                </div>
                <div id="feedbackContainer"></div>
                <div class="test-input-wrapper">
                    <input 
                        type="text" 
                        id="answerInput" 
                        class="test-input" 
                        placeholder="Wpisz odpowiedź..."
                        autocomplete="off"
                        onkeypress="if(event.key==='Enter') checkAnswer()"
                    />
                </div>
                <div class="hint-text">Naciśnij Enter lub wpisz odpowiedź</div>
            `;

            setTimeout(() => {
                document.getElementById('answerInput').focus();
            }, 100);

            isAnswered = false;
            currentAttempt = 0;
        }

        function checkAnswer() {
            if (isAnswered) {
                nextQuestion();
                return;
            }

            const wordData = testWords[currentTestIndex];
            const isDE = testFilter === 'pl-de' ? false : true;
            const correctAnswer = isDE ? wordData.pl : wordData.de;
            const userAnswer = document.getElementById('answerInput').value;

            if (!userAnswer.trim()) {
                return;
            }

            const check = isAlmostCorrect(userAnswer, correctAnswer);
            const input = document.getElementById('answerInput');
            const feedbackContainer = document.getElementById('feedbackContainer');

            if (check.type === 'correct') {
                // Poprawnie!
                input.classList.add('correct');
                input.disabled = true;
                feedbackContainer.innerHTML = `
                    <div class="feedback-message feedback-correct">
                        <div class="feedback-correct-icon">✓</div>
                        Świetnie!
                    </div>
                `;
                testAnswers[currentTestIndex] = { correct: true, word: wordData };
                isAnswered = true;

                setTimeout(() => {
                    nextQuestion();
                }, 1500);
            } else if (check.type === 'almost') {
                // Blisko!
                currentAttempt++;
                input.classList.add('incorrect');
                input.value = '';
                feedbackContainer.innerHTML = `
                    <div class="feedback-message feedback-almost">
                        <div class="feedback-almost-icon">🔍</div>
                        Blisko! Spróbuj jeszcze raz (szansa ${2 - currentAttempt}/2)
                    </div>
                `;

                if (currentAttempt >= 2) {
                    // Po 2 próbach - zła odpowiedź
                    setTimeout(() => {
                        showWrongAnswer(correctAnswer, wordData.originalIndex);
                    }, 1500);
                } else {
                    input.classList.remove('incorrect');
                    setTimeout(() => {
                        input.focus();
                    }, 100);
                }
            } else {
                // Źle!
                input.classList.add('incorrect');
                input.disabled = true;
                feedbackContainer.innerHTML = `
                    <div class="feedback-message feedback-close">
                        <div class="feedback-close-icon">✗</div>
                        Nieprawidłowa odpowiedź
                    </div>
                `;
                showWrongAnswer(correctAnswer, wordData.originalIndex);
            }
        }

        function showWrongAnswer(correctAnswer, wordIndex) {
            const feedbackContainer = document.getElementById('feedbackContainer');
            const extra = feedbackContainer.innerHTML;
            
            feedbackContainer.innerHTML = extra + `
                <div class="correct-answer-reveal">
                    <div class="correct-answer-label">Prawidłowa odpowiedź:</div>
                    <div class="correct-answer-text">${correctAnswer}</div>
                </div>
            `;

            wordErrors[wordIndex] = (wordErrors[wordIndex] || 0) + 1;
            saveErrors();
            testAnswers[currentTestIndex] = { correct: false, word: testWords[currentTestIndex] };
            isAnswered = true;

            setTimeout(() => {
                nextQuestion();
            }, 2500);
        }

        function nextQuestion() {
            currentTestIndex++;
            renderTestQuestion();
        }

        function showTestResult() {
            const correct = Object.values(testAnswers).filter(a => a.correct).length;
            const total = testWords.length;
            const percentage = Math.round((correct / total) * 100);

            const isSuccess = percentage >= 70;
            if (isSuccess) incrementStreak();

            document.getElementById('testContainer').innerHTML = `
                <div class="test-result ${isSuccess ? 'success' : 'fail'}">
                    <div class="result-number">${correct}/${total}</div>
                    <div style="font-size: 18px; margin-bottom: 20px;">
                        Wynik: ${percentage}%
                    </div>
                    <div style="color: #666; margin-bottom: 20px;">
                        ${isSuccess ? '🎉 Świetnie! Kontynuuj naukę!' : '💪 Spróbuj jeszcze raz!'}
                    </div>
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="startNewTest()">Jeszcze raz</button>
                        <button class="btn btn-secondary" onclick="switchTab('errors')">Zobacz błędy</button>
                    </div>
                </div>
            `;
        }

        function renderErrors() {
            const container = document.getElementById('errorsContainer');
            const errorWords = vocabulary.filter((_, idx) => wordErrors[idx] > 0);

            if (errorWords.length === 0) {
                container.innerHTML = '<div class="no-errors">✨ Brak błędów! Świetnie się uczysz!</div>';
                return;
            }

            // Sort by number of errors
            const sorted = errorWords.sort((a, b) => {
                const idxA = vocabulary.indexOf(a);
                const idxB = vocabulary.indexOf(b);
                return (wordErrors[idxB] || 0) - (wordErrors[idxA] || 0);
            });

            container.innerHTML = sorted.map(word => {
                const idx = vocabulary.indexOf(word);
                return `
                    <div class="error-word-card">
                        <div class="error-word">🇩🇪 ${word.de} → 🇵🇱 ${word.pl}</div>
                        <div class="error-count">⚠️ Błędy: ${wordErrors[idx]}</div>
                    </div>
                `;
            }).join('');

            // Update stats
            const statsContainer = document.getElementById('errorStats');
            const stats = {
                total: Object.keys(wordErrors).length,
                errors: Object.values(wordErrors).reduce((a, b) => a + b, 0),
                accuracy: Math.round((1 - Object.values(wordErrors).reduce((a, b) => a + b, 0) / (vocabulary.length * 5)) * 100)
            };
            statsContainer.innerHTML = `
                <div class="stat-box">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">Słówek z błędami</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${stats.errors}</div>
                    <div class="stat-label">Razem błędów</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number">${stats.accuracy}%</div>
                    <div class="stat-label">Dokładność</div>
                </div>
            `;
        }

        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            if (event.target) {
                event.target.classList.add('active');
            }

            if (tabName === 'errors') {
                renderErrors();
            }
        }

        init();
    </script>
</body>
</html>
